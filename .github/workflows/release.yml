# Builds Verba for every desktop it runs on and attaches the artifacts to the
# release for the tag that triggered it.
#
# Why CI and not a laptop: each target needs its own webview and system libraries
# (WebKitGTK on Linux, WebView2 on Windows), so there is no honest way to
# cross-compile these from a Mac. The runners are the only place all four get
# built the same way.
#
# sherpa-onnx does not need special handling here: its build script downloads a
# prebuilt static library per target, which is exactly why the bundled speech
# tier can cross platforms at all. It does mean the first build on each runner
# spends ~20s fetching that library before it compiles anything.
name: release

on:
  push:
    tags: ["v*"]
  # Lets a tag that was cut before this workflow existed (v0.1.0) be built and
  # have its artifacts attached after the fact.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and attach artifacts to"
        required: true

jobs:
  build:
    permissions:
      contents: write
    strategy:
      # One target failing must not delete the artifacts of the three that
      # worked — a release with three platforms beats a release with none.
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            label: macOS (Apple Silicon)
          - platform: macos-latest
            target: x86_64-apple-darwin
            label: macOS (Intel)
          - platform: ubuntu-22.04
            target: ""
            label: Linux
          - platform: windows-latest
            target: ""
            label: Windows

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      # Tauri v2 on Linux wants WebKitGTK 4.1 (not 4.0 — that is Tauri v1) and
      # patchelf for the AppImage.
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            build-essential curl wget file libxdo-dev libssl-dev

      # 22, not 20: the .check.ts scripts are run through `--experimental-strip-types`,
      # which does not exist before 22.6.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # Before anything is built: the updater compares versions, so a release
      # that bumped two of the three files must not reach an installed copy.
      - name: Check the version matches across all three files
        run: node scripts/version.mjs

      # Pure-logic checks, on every target. They are fast, and a pack that fails
      # validation should not be shipped to anyone.
      - name: Run checks
        run: |
          node --experimental-strip-types src/lib/srs.check.ts
          node --experimental-strip-types src/lib/phase2.check.ts
          node --experimental-strip-types src/lib/phase3.check.ts
          node --experimental-strip-types src/lib/lang.check.ts
          node --experimental-strip-types src/lib/speech.check.ts
          node --experimental-strip-types src/lib/onboarding.check.ts
          node --experimental-strip-types src/lib/memory.check.ts
        shell: bash

      # Build only. tauri-action can cut the release itself, but it also owns the
      # title and body when it does — and v0.1.0's notes were written by hand.
      # Building here and uploading below keeps the action away from the prose.
      - uses: tauri-apps/tauri-action@v0
        id: build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # createUpdaterArtifacts is on, so every target also produces an update
          # bundle and its minisign .sig. Without these the build fails outright.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: ${{ matrix.target && format('--target {0}', matrix.target) || '' }}

      # `--clobber` so re-running a build replaces its own artifact instead of
      # failing on a name that is already there.
      #
      # The macOS rename is not cosmetic. Tauri names the updater bundle
      # `Verba.app.tar.gz` with no architecture in it, so both macOS legs of this
      # matrix produce the same filename — and `--clobber` would let whichever
      # finishes second quietly overwrite the other, leaving one of the two Macs
      # downloading a build for the wrong chip.
      - name: Attach artifacts to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          PATHS: ${{ steps.build.outputs.artifactPaths }}
          TARGET: ${{ matrix.target }}
        run: |
          arch="${TARGET%%-*}"
          echo "$PATHS" | tr -d '[]"' | tr ',' '\n' | while read -r p; do
            p=$(echo "$p" | xargs)
            [ -f "$p" ] || continue

            base=$(basename "$p")
            case "$base" in
              *.app.tar.gz|*.app.tar.gz.sig)
                if [ -z "$arch" ]; then
                  echo "a macOS updater bundle built without --target: cannot tell the two Macs apart" >&2
                  exit 1
                fi
                renamed="${base/.app.tar.gz/_${arch}.app.tar.gz}"
                cp "$p" "$(dirname "$p")/$renamed"
                p="$(dirname "$p")/$renamed"
                ;;
            esac

            echo "uploading $(basename "$p")"
            gh release upload "$TAG" "$p" --clobber --repo "$GITHUB_REPOSITORY"
          done
        shell: bash

  # Separate job, after the whole matrix: a manifest that names four platforms
  # cannot be written by a job that knows about one. It also means a partial
  # matrix publishes nothing — `needs` skips this job if any leg failed — which
  # is the right failure. An update offered to a platform whose bundle never
  # uploaded is worse than no update at all.
  manifest:
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Write the manifest and publish it to the `updates` tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail

          gh release view "$TAG" --json body,assets --repo "$GITHUB_REPOSITORY" > release.json

          # No .sig among the assets means nothing was signed and there is
          # nothing to point at — gh fails here, and the job stops.
          mkdir sigs
          gh release download "$TAG" --pattern "*.sig" --dir sigs --repo "$GITHUB_REPOSITORY"

          node scripts/manifest.mjs "$TAG" release.json sigs > manifest.json
          cat manifest.json

          # One release, pinned to a tag that never moves, holding both channel
          # manifests. `--latest=false` keeps it out of the way of the real
          # releases people download by hand.
          gh release view updates --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create updates \
              --title "Update manifests" \
              --notes "Machine-written. \`stable.json\` and \`beta.json\` are what installed copies of Verba check for updates. Not a download." \
              --latest=false \
              --repo "$GITHUB_REPOSITORY"

          # A beta tag moves the beta channel only. A stable tag moves both —
          # which is also what gives a beta tester the fallback: beta.json always
          # holds the most recent thing built, whichever channel produced it.
          case "$TAG" in
            *-beta.*) channels="beta" ;;
            *) channels="beta stable" ;;
          esac

          for channel in $channels; do
            cp manifest.json "$channel.json"
            gh release upload updates "$channel.json" --clobber --repo "$GITHUB_REPOSITORY"
            echo "published $channel.json"
          done
        shell: bash
